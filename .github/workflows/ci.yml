name: CI
on:
  workflow_dispatch:

  pull_request:

  push:
    branches: [main]

permissions:
  contents: read

# cancel currently running jobs if a new version of the branch is pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - run: go version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet -tags testing ./...

      - name: Build CLI binary
        run: |
          go build -o corso .
          ./corso --version

  Source-Code-Linting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Go Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep pinned to a version as updates may add new lint failures in
          # unchanged code. Must match WANTED_LINT_VERSION in src/Makefile.
          version: v2.14.0
          working-directory: src
          args: --timeout 30m

      - name: Get go-licenses
        run: go install github.com/google/go-licenses/v2@latest

      # go-jmespath is Apache-2.0, but its LICENSE only carries the short
      # notice, which the classifier does not recognize.
      - name: Run go-licenses
        run: >-
          go-licenses check github.com/alcionai/corso/src
          --ignore github.com/alcionai/corso/src
          --ignore github.com/jmespath/go-jmespath

  Actions-Lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  Unit-Test-Suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    env:
      CORSO_LOG_FILE: ${{ github.workspace }}/src/testlog/run-unit.log
    steps:
      - uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - run: mkdir testlog

      # Integration tests skip themselves unless CORSO_CI_TESTS and the
      # tenant/storage env vars are set, so this runs unit tests only.
      - name: Unit Tests
        env:
          # Set these to a bad value so we don't accidentally fall back to
          # something elsewhere.
          CORSO_M365_TEST_USER_ID: 'foo'
          CORSO_SECONDARY_M365_TEST_USER_ID: 'foo'
        run: |
          set -euo pipefail
          go test       \
          -tags testing \
          -p 1          \
          -timeout 30m  \
          ./... \
          2>&1 | tee ./testlog/gotest-unit.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-log
          path: src/testlog/*
          if-no-files-found: error
          retention-days: 14
