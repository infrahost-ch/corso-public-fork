name: Release
on:
  push:
    tags: ["v*.*.*"]

  # Manual runs build a snapshot and keep it as a workflow artifact only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # required to create the GitHub release and upload its assets
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs the tags and history for the changelog

      - name: Setup Golang with cache
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          workdir: src
          args: >-
            release --clean --parallelism 1
            ${{ startsWith(github.ref, 'refs/tags/') && ' ' || '--snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot binaries
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: corso-snapshot
          path: |
            src/dist/*.tar.gz
            src/dist/*.zip
            src/dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
