# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # Maintain dependencies for go - src
  - package-ecosystem: "gomod"
    directory: "src/"
    schedule:
      interval: "weekly"
    groups:
      graph-sdk:
        patterns:
          - "github.com/microsoftgraph/*"
          - "github.com/microsoft/kiota-*"
          - "github.com/Azure/azure-sdk-for-go/*"
      go-deps:
        patterns: ["*"]
    ignore:
      # Pinned through a replace directive (Alcion fork); see design/fork/kopia-analyse.md.
      - dependency-name: "github.com/kopia/kopia"
      - dependency-name: "github.com/xhit/go-simple-mail/v2"
      # >= 7.0.83 breaks the S3 credentials provider of the Alcion kopia fork.
      - dependency-name: "github.com/minio/minio-go/v7"
        versions: [">= 7.0.83"]
      # Later versions moved the error helpers into cluerr.
      - dependency-name: "github.com/alcionai/clues"
      # Pinned by the original maintainers ("do not update").
      - dependency-name: "github.com/vbauerster/mpb/v8"
    open-pull-requests-limit: 5
