version: "2"
linters:
  enable:
    - exhaustive
    - forbidigo
    - lll
    - loggercheck
    - misspell
    - revive
    - staticcheck
    - usestdlibvars
    - wsl
  settings:
    exhaustive:
      check:
        - switch
      default-signifies-exhaustive: false
      explicit-exhaustive-switch: true
    forbidigo:
      forbid:
        - pattern: context\.(Background|TODO)(# tests should use tester\.NewContext)?
        - pattern: \bpath\.(Ext|Base|Dir|Join)
        - pattern: '[Mm]356(# typo: should be 365)?'
        - pattern: suite\.Suite(# tests should use one of the Suite wrappers in tester package)?
        - pattern: (errors|fmt)\.(New|Stack|Wrap|Error)f?\((# error handling should use clues pkg)?
        - pattern: Warnw?f?\((# logging should use Info or Error)?
        - pattern: (T\(\)|\st[a-zA-Z0-9]*)\.Run(# prefer testify suite.Run(name, func()) )?
        - pattern: 'WithClues(# prefer the builderWC variant - ex: StackWC(ctx, ...))?'
    govet:
      disable:
        # Suggests replacing golang.org/x/exp calls with their stdlib
        # counterparts (//go:fix inline); most reports are "cannot inline".
        # The x/exp -> stdlib migration is a separate change.
        - inline
    lll:
      line-length: 120
    misspell:
      ignore-rules:
        # Graph SDK type name (models.Conversationable), not a typo.
        - conversationable
    staticcheck:
      # Mirrors the former standalone staticcheck run (staticcheck.conf).
      # Quickfix suggestions (QF) were never reported there.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF*
      dot-import-whitelist:
        - github.com/alcionai/corso/src/cli/print
    revive:
      max-open-files: 2048
      rules:
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: errorf
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: exported
        - name: identical-branches
        - name: if-return
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-equal
        - name: time-naming
        - name: unreachable-code
        - name: use-any
        - name: useless-break
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: exported:.*details.DetailsModel by other packages, and that stutters
      - linters:
          - revive
        text: exported:.*details.DetailsEntry by other packages, and that stutters
      - linters:
          - revive
        text: exported:.*mock.MockModelStore by other packages, and that stutters
      - linters:
          - revive
        text: unexported-return:.*unexported type selectors.exchangeCategory
      - linters:
          - revive
        text: unexported-return:.*unexported type.*kopia.conn
      - linters:
          - revive
        path: _test\.go
        text: import-shadowing:.*'suite' shadows
      - linters:
          - forbidigo
        path: ^.{4}\.go|.*([^_].{4}|_[^t].{3}|_t[^e].{2}|_te[^s].{1}|_tes[^t])\.go
        text: context.(Background|TODO)
      - linters:
          - lll
        path: internal/m365/collection/drive/collections_test.go
      - linters:
          - lll
        path: internal/m365/collection/drive/collections_tree_test.go
      - linters:
          - errcheck
          - forbidigo
          - lll
          - misspell
          - revive
          - wsl
        path: pkg/services/m365/api/graph/betasdk
      - linters:
          - forbidigo
        path: internal/tester/suite.go
        text: suite.Suite
      - linters:
          - forbidigo
        path: pkg/account
        text: suite.Suite
      - linters:
          - forbidigo
        path: pkg/storage
        text: suite.Suite
      - linters:
          - forbidigo
        path: pkg/repository/loadtest
        text: suite.Suite
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 50
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/alcionai/corso)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - pkg/services/m365/api/graph/betasdk
